<div class="mx-auto flex min-h-screen w-full max-w-4xl flex-col gap-6 px-4 py-6 sm:px-6 lg:px-8">
  <header>
    <h1 class="font-editorial text-2xl font-bold tracking-tight text-ink sm:text-3xl">
      {{ i18n.t().settings.title }}
    </h1>
    <p class="mt-1 text-sm text-ink-secondary">
      {{ i18n.t().settings.subtitle }}
    </p>
  </header>

  <app-settings-preferences-section />

  <app-storage-quota-inspector
    [breakdown]="storageBreakdown()"
    (refreshRequested)="refreshStorageBreakdown()"
  />

  <app-data-health-section />

  <app-data-portability-section
    (dataChanged)="refreshStorageBreakdown()"
    (requestCoverEnrichment)="scrollToCoverEnrichment()"
  />

  <app-cover-enrichment-section #coverEnrichmentSection />

  <app-danger-zone-section (dataReset)="refreshStorageBreakdown()" />
</div>
