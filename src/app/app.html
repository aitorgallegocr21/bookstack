<div class="min-h-[100dvh] bg-canvas text-ink">
  <app-sidebar class="hidden md:flex"></app-sidebar>

  @if (dockPosition.isDragging() && snapPreviewRect(); as rect) {
    <div
      class="pointer-events-none fixed z-40 rounded-2xl border-2 border-dashed border-accent-border bg-accent-soft/60 transition-[top,right,bottom,left,width,height] duration-150"
      [style.top]="rect.top"
      [style.right]="rect.right"
      [style.bottom]="rect.bottom"
      [style.left]="rect.left"
      [style.width]="rect.width"
      [style.height]="rect.height"
      aria-hidden="true"
    ></div>
  }

  <main
    class="transition-[margin,padding] duration-200"
    [class]="mainOffsetClasses()"
    [style.--sidebar-width]="uiState.isSidebarCollapsed() ? '68px' : '240px'"
  >
    <router-outlet (activate)="onRouteActivate()"></router-outlet>
  </main>

  <app-bottom-nav class="md:hidden"></app-bottom-nav>

  @defer (when booksService.isCreateModalOpen()) {
    @if (booksService.isCreateModalOpen()) {
      <app-book-create-modal (closed)="booksService.closeCreateModal()"></app-book-create-modal>
    }
  }

  <app-confirm-dialog />
</div>
