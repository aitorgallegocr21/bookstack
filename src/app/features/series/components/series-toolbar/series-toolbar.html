<section
  class="flex flex-col gap-3 rounded-2xl border border-slate-200/80 bg-white p-3 shadow-xs sm:p-4 dark:border-slate-800 dark:bg-slate-900"
  [attr.aria-label]="i18n.t().series.galleryAria"
>
  <!-- Top Row: Live Search + Sort Dropdown -->
  <div class="flex flex-col gap-2.5 sm:flex-row sm:items-center sm:justify-between">
    <div class="relative min-w-0 flex-1">
      <label for="series-search-input" class="sr-only">
        {{ i18n.t().series.searchAria }}
      </label>
      <div
        class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 dark:text-slate-500"
        aria-hidden="true"
      >
        <svg [lucideIcon]="Search" size="18" stroke-width="2"></svg>
      </div>

      <input
        id="series-search-input"
        type="text"
        [value]="searchQuery()"
        (input)="onSearchInput($event)"
        [placeholder]="i18n.t().series.searchPlaceholder"
        [attr.aria-label]="i18n.t().series.searchAria"
        class="h-11 w-full rounded-xl border border-slate-200 bg-slate-50/70 pr-11 pl-10 text-sm text-slate-800 transition-colors placeholder:text-slate-400 focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-500/20 focus:outline-none dark:border-slate-700 dark:bg-slate-800/80 dark:text-slate-100 dark:placeholder:text-slate-500 dark:focus:border-blue-400 dark:focus:bg-slate-800"
      />

      @if (searchQuery().length > 0) {
        <button
          type="button"
          (click)="clearSearch()"
          [attr.aria-label]="i18n.t().series.clearSearchAria"
          [title]="i18n.t().series.clearSearchAria"
          class="absolute inset-y-0 right-0 flex min-h-[44px] min-w-[44px] items-center justify-center text-slate-400 transition-colors hover:text-slate-700 focus-visible:rounded-xl focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:outline-none dark:hover:text-slate-200"
        >
          <svg [lucideIcon]="X" size="18" stroke-width="2.5"></svg>
        </button>
      }
    </div>

    <div class="relative min-w-0 shrink-0">
      <label for="series-sort-select" class="sr-only">
        {{ i18n.t().series.sortAria }}
      </label>
      <select
        id="series-sort-select"
        [value]="sortOption()"
        (change)="onSortChange($event)"
        [attr.aria-label]="i18n.t().series.sortAria"
        class="h-11 w-full rounded-xl border border-slate-200 bg-slate-50/70 px-3 text-xs font-medium text-slate-700 transition-colors focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-500/20 focus:outline-none sm:w-auto sm:text-sm dark:border-slate-700 dark:bg-slate-800/80 dark:text-slate-200 dark:focus:border-blue-400 dark:focus:bg-slate-800"
      >
        @for (opt of sortOptions; track opt) {
          <option [value]="opt">{{ getSortLabel(opt) }}</option>
        }
      </select>
    </div>
  </div>

  <!-- Bottom Row: Wrapping Status Filter Chips + Contextual Reset -->
  <div
    class="flex flex-wrap items-center justify-between gap-2 border-t border-slate-100 pt-2.5 dark:border-slate-800/80"
  >
    <div
      role="tablist"
      [attr.aria-label]="i18n.t().series.galleryAria"
      class="flex min-w-0 flex-1 flex-wrap items-center gap-1.5"
    >
      @for (status of filterStatuses; track status) {
        <button
          type="button"
          role="tab"
          (click)="onStatusSelect(status)"
          [attr.aria-selected]="statusFilter() === status"
          [class]="
            statusFilter() === status
              ? 'border-blue-600 bg-blue-600 text-white shadow-xs hover:bg-blue-500 dark:border-blue-500 dark:hover:bg-blue-500'
              : 'border-slate-200/90 bg-slate-50 text-slate-700 hover:border-slate-300 hover:bg-slate-100 hover:text-slate-900 dark:border-slate-700/80 dark:bg-slate-800/80 dark:text-slate-300 dark:hover:border-slate-600 dark:hover:bg-slate-700/80 dark:hover:text-white'
          "
          class="inline-flex min-h-[44px] items-center gap-1.5 rounded-xl border px-3 py-1.5 text-xs font-medium transition-colors focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:outline-none sm:min-h-[38px] sm:text-sm"
        >
          <span>{{ getStatusLabel(status) }}</span>
          <span
            [class]="
              statusFilter() === status
                ? 'bg-white/25 text-white'
                : 'bg-slate-200/80 text-slate-700 dark:bg-slate-700 dark:text-slate-200'
            "
            class="rounded-full px-2 py-0.5 text-[11px] font-semibold tabular-nums"
          >
            {{ getStatusCount(status) }}
          </span>
        </button>
      }
    </div>

    @if (hasActiveFilters()) {
      <button
        type="button"
        (click)="onResetFilters()"
        [attr.aria-label]="i18n.t().series.empty.resetFilters"
        class="inline-flex min-h-[44px] shrink-0 items-center gap-1.5 rounded-xl border border-rose-200/90 bg-rose-50/80 px-3 py-1.5 text-xs font-medium text-rose-700 transition-colors hover:border-rose-300 hover:bg-rose-100 focus-visible:ring-2 focus-visible:ring-rose-500 focus-visible:outline-none sm:min-h-[38px] sm:text-sm dark:border-rose-900/60 dark:bg-rose-950/40 dark:text-rose-300 dark:hover:border-rose-800 dark:hover:bg-rose-900/50"
      >
        <svg [lucideIcon]="RotateCcw" size="14" stroke-width="2.2"></svg>
        <span>{{ i18n.t().series.empty.resetFilters }}</span>
      </button>
    }
  </div>
</section>
