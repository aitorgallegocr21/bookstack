<header class="md:hidden w-full bg-white dark:bg-slate-900 shadow-sm" role="banner">
  <div class="w-full px-4 py-3 flex items-center justify-between">
    <a routerLink="/" class="flex items-center gap-2 font-semibold text-lg" aria-label="Ir al inicio">
      <svg [lucideIcon]="Home" size="20" stroke-width="2"></svg>
      <span>Bookstack</span>
    </a>

    <button
      class="inline-flex items-center justify-center p-2 rounded-xl border bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:outline-none transition-colors duration-200"
      (click)="toggleTheme()"
      [attr.aria-pressed]="themeService.isDark()"
      title="Alternar tema"
    >
      <svg
        [lucideIcon]="themeService.isDark() ? Sun : Moon"
        size="18"
        stroke-width="2"
        class="transition-transform duration-300"
      ></svg>
    </button>
  </div>
</header>
