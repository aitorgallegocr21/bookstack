<nav
  class="fixed right-0 bottom-0 left-0 border-t border-slate-200 bg-white pb-[env(safe-area-inset-bottom)] md:hidden dark:border-slate-800 dark:bg-slate-900"
  role="navigation"
  [attr.aria-label]="i18n.t().nav.bottomNavAria"
>
  <div class="mx-auto flex max-w-4xl items-center justify-between px-2 py-2">
    <a
      routerLink="/"
      routerLinkActive="text-sky-600 dark:text-sky-400"
      [routerLinkActiveOptions]="{ exact: true }"
      class="flex-1 py-3 text-center focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:outline-none"
      [attr.aria-label]="i18n.t().nav.home"
      [title]="i18n.t().nav.home"
    >
      <div class="flex flex-col items-center gap-1">
        <svg [lucideIcon]="Home" size="20" stroke-width="2"></svg>
        <span class="text-xs">{{ i18n.t().nav.home }}</span>
      </div>
    </a>

    <a
      routerLink="/books"
      routerLinkActive="text-sky-600 dark:text-sky-400"
      class="flex-1 py-3 text-center focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:outline-none"
      [attr.aria-label]="i18n.t().nav.books"
      [title]="i18n.t().nav.books"
    >
      <div class="flex flex-col items-center gap-1">
        <svg [lucideIcon]="Book" size="20" stroke-width="2"></svg>
        <span class="text-xs">{{ i18n.t().nav.books }}</span>
      </div>
    </a>

    <a
      routerLink="/stats"
      routerLinkActive="text-sky-600 dark:text-sky-400"
      class="flex-1 py-3 text-center focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:outline-none"
      [attr.aria-label]="i18n.t().nav.stats"
      [title]="i18n.t().nav.stats"
    >
      <div class="flex flex-col items-center gap-1">
        <svg [lucideIcon]="Stats" size="20" stroke-width="2"></svg>
        <span class="text-xs">{{ i18n.t().nav.stats }}</span>
      </div>
    </a>

    <a
      routerLink="/settings"
      routerLinkActive="text-sky-600 dark:text-sky-400"
      class="flex-1 py-3 text-center focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:outline-none"
      [attr.aria-label]="i18n.t().nav.settings"
      [title]="i18n.t().nav.settings"
    >
      <div class="flex flex-col items-center gap-1">
        <svg [lucideIcon]="Settings" size="20" stroke-width="2"></svg>
        <span class="text-xs">{{ i18n.t().nav.settings }}</span>
      </div>
    </a>

    <a
      routerLink="/about"
      routerLinkActive="text-sky-600 dark:text-sky-400"
      class="hidden flex-1 py-3 text-center focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:outline-none min-[350px]:flex"
      [attr.aria-label]="i18n.t().nav.about"
      [title]="i18n.t().nav.about"
    >
      <div class="flex w-full flex-col items-center gap-1">
        <svg [lucideIcon]="About" size="20" stroke-width="2"></svg>
        <span class="text-xs">{{ i18n.t().nav.about }}</span>
      </div>
    </a>
  </div>
</nav>
