<section
  class="space-y-5 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-slate-900"
  aria-labelledby="settings-preferences-heading"
>
  <div>
    <h2
      id="settings-preferences-heading"
      class="text-base font-bold text-slate-900 dark:text-slate-100"
    >
      {{ i18n.t().settings.preferences.sectionTitle }}
    </h2>
    <p class="mt-1 text-sm text-slate-600 dark:text-slate-400">
      {{ i18n.t().settings.preferences.sectionDescription }}
    </p>
  </div>

  <div class="grid grid-cols-1 gap-4 sm:grid-cols-3">
    <!-- Active Language -->
    <div>
      <label for="settings-language" class="field-label">
        {{ i18n.t().settings.languageLabel }}
      </label>
      <div class="select-wrap">
        <select
          id="settings-language"
          class="field-select min-h-[44px]"
          [value]="i18n.locale()"
          (change)="onLocaleChange($event)"
        >
          <option value="es">{{ i18n.t().settings.spanishOption }}</option>
          <option value="en">{{ i18n.t().settings.englishOption }}</option>
        </select>
      </div>
    </div>

    <!-- Visual Theme -->
    <div>
      <span id="settings-theme-label" class="field-label">
        {{ i18n.t().settings.preferences.themeLabel }}
      </span>
      <div
        role="group"
        aria-labelledby="settings-theme-label"
        class="grid grid-cols-2 gap-1 rounded-xl border border-slate-200 bg-slate-100 p-1 dark:border-slate-700 dark:bg-slate-800"
      >
        <button
          type="button"
          data-testid="theme-light-btn"
          class="min-h-[44px] rounded-lg px-3 py-2 text-sm font-semibold transition-colors focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:outline-none"
          [class]="
            !themeService.isDark()
              ? 'bg-white text-slate-900 shadow-sm dark:bg-slate-700 dark:text-slate-100'
              : 'text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-slate-100'
          "
          [attr.aria-pressed]="!themeService.isDark()"
          (click)="setTheme('light')"
        >
          {{ i18n.t().settings.preferences.themeLight }}
        </button>
        <button
          type="button"
          data-testid="theme-dark-btn"
          class="min-h-[44px] rounded-lg px-3 py-2 text-sm font-semibold transition-colors focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:outline-none"
          [class]="
            themeService.isDark()
              ? 'bg-white text-slate-900 shadow-sm dark:bg-slate-700 dark:text-slate-100'
              : 'text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-slate-100'
          "
          [attr.aria-pressed]="themeService.isDark()"
          (click)="setTheme('dark')"
        >
          {{ i18n.t().settings.preferences.themeDark }}
        </button>
      </div>
    </div>

    <!-- Default Catalog View -->
    <div>
      <label for="settings-default-view" class="field-label">
        {{ i18n.t().settings.preferences.defaultViewLabel }}
      </label>
      <div class="select-wrap">
        <select
          id="settings-default-view"
          class="field-select min-h-[44px]"
          [value]="catalogFilter.viewMode()"
          (change)="onViewModeChange($event)"
        >
          <option value="grid">{{ i18n.t().settings.preferences.viewGrid }}</option>
          <option value="detailed">{{ i18n.t().settings.preferences.viewDetailed }}</option>
          <option value="compact">{{ i18n.t().settings.preferences.viewCompact }}</option>
        </select>
      </div>
    </div>
  </div>
</section>
