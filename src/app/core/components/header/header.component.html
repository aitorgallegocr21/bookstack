<header class="w-full bg-white shadow-sm md:hidden dark:bg-slate-900" role="banner">
  <div class="flex w-full items-center justify-between gap-3 px-4 py-3">
    <a
      routerLink="/"
      class="flex min-h-[44px] items-center gap-2 text-lg font-semibold focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:outline-none"
      [attr.aria-label]="i18n.t().nav.home"
    >
      <svg [lucideIcon]="Home" size="20" stroke-width="2"></svg>
      <span>BookStack</span>
    </a>

    <div class="flex items-center gap-2">
      <a
        href="https://github.com/aitorgallegocr21/bookstack.git"
        target="_blank"
        rel="noopener noreferrer"
        class="inline-flex h-11 w-11 items-center justify-center rounded-xl border border-slate-200 bg-white text-slate-700 transition-colors hover:bg-slate-100 focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:outline-none dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700"
        [attr.aria-label]="i18n.t().nav.github"
        [title]="i18n.t().nav.github"
      >
        <svg [lucideIcon]="Github" size="18" stroke-width="2"></svg>
      </a>

      <button
        type="button"
        class="inline-flex h-11 w-11 items-center justify-center rounded-xl border border-slate-200 bg-white text-slate-700 transition-colors duration-300 hover:bg-slate-100 focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:outline-none dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700"
        (click)="toggleTheme()"
        [attr.aria-pressed]="themeService.isDark()"
        [attr.aria-label]="
          themeService.isDark() ? i18n.t().nav.switchToLight : i18n.t().nav.switchToDark
        "
        [title]="themeService.isDark() ? i18n.t().nav.switchToLight : i18n.t().nav.switchToDark"
      >
        <svg
          [lucideIcon]="themeService.isDark() ? Sun : Moon"
          size="18"
          stroke-width="2"
          class="transition-transform duration-300"
          [class.rotate-180]="themeService.isDark()"
        ></svg>
      </button>

      <button
        type="button"
        class="inline-flex h-11 w-11 items-center justify-center rounded-xl bg-blue-600 text-white shadow-sm transition-colors hover:bg-blue-500 focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2 focus-visible:outline-none dark:focus-visible:ring-offset-slate-900"
        (click)="openCreateModal()"
        [attr.aria-label]="i18n.t().nav.createBookAria"
        [title]="i18n.t().nav.createBookAria"
      >
        <svg [lucideIcon]="Plus" size="18" stroke-width="2.5"></svg>
      </button>
    </div>
  </div>
</header>
