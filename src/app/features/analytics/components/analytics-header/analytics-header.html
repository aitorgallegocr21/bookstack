<header class="flex flex-col gap-4 lg:flex-row lg:items-end lg:justify-between">
  <div class="min-w-0">
    <h1 class="font-editorial text-2xl font-bold tracking-tight text-ink sm:text-3xl">
      {{ i18n.t().stats.title }}
    </h1>
    <p class="mt-1 text-sm text-ink-secondary">
      {{ i18n.t().stats.subtitle }}
    </p>
  </div>

  <div
    role="group"
    [attr.aria-label]="i18n.t().stats.periods.groupAria"
    class="flex flex-wrap items-center gap-2.5"
  >
    <div
      class="flex w-full flex-wrap items-center gap-1 rounded-2xl border border-subtle bg-surface-subtle p-1 sm:inline-flex sm:w-auto"
    >
      <button
        type="button"
        data-testid="period-btn-current-year"
        (click)="setPeriodMode('current-year')"
        [attr.aria-pressed]="periodMode() === 'current-year'"
        [class]="
          periodMode() === 'current-year'
            ? 'bg-surface-elevated text-ink shadow-xs'
            : 'text-ink-secondary hover:text-ink'
        "
        class="inline-flex min-h-11 flex-1 items-center justify-center rounded-xl px-3.5 py-2 text-xs font-semibold whitespace-nowrap tabular-nums transition-colors focus-visible:ring-2 focus-visible:ring-accent focus-visible:outline-none sm:min-h-9 sm:flex-initial sm:text-sm"
      >
        {{ i18n.t().stats.periods.currentYear }} ({{ currentReferenceYear() }})
      </button>

      <button
        type="button"
        data-testid="period-btn-last-12-months"
        (click)="setPeriodMode('last-12-months')"
        [attr.aria-pressed]="periodMode() === 'last-12-months'"
        [class]="
          periodMode() === 'last-12-months'
            ? 'bg-surface-elevated text-ink shadow-xs'
            : 'text-ink-secondary hover:text-ink'
        "
        class="inline-flex min-h-11 flex-1 items-center justify-center rounded-xl px-3.5 py-2 text-xs font-semibold whitespace-nowrap transition-colors focus-visible:ring-2 focus-visible:ring-accent focus-visible:outline-none sm:min-h-9 sm:flex-initial sm:text-sm"
      >
        {{ i18n.t().stats.periods.last12Months }}
      </button>

      <button
        type="button"
        data-testid="period-btn-all-time"
        (click)="setPeriodMode('all-time')"
        [attr.aria-pressed]="periodMode() === 'all-time'"
        [class]="
          periodMode() === 'all-time'
            ? 'bg-surface-elevated text-ink shadow-xs'
            : 'text-ink-secondary hover:text-ink'
        "
        class="inline-flex min-h-11 flex-1 items-center justify-center rounded-xl px-3.5 py-2 text-xs font-semibold whitespace-nowrap transition-colors focus-visible:ring-2 focus-visible:ring-accent focus-visible:outline-none sm:min-h-9 sm:flex-initial sm:text-sm"
      >
        {{ i18n.t().stats.periods.allTime }}
      </button>
    </div>

    @if (availableYears().length > 1) {
      <div class="inline-flex items-center gap-2">
        <label for="analytics-year-select" class="text-xs font-semibold text-ink-secondary">
          {{ i18n.t().stats.periods.specificYearLabel }}
        </label>
        <select
          id="analytics-year-select"
          data-testid="period-year-select"
          [attr.aria-label]="i18n.t().stats.periods.specificYearAria"
          [value]="selectedYear()"
          (change)="onYearSelectChange($event)"
          [class]="
            periodMode() === 'specific-year'
              ? 'border-accent-border bg-accent-soft text-accent-soft-text'
              : 'border-strong bg-surface-elevated text-ink'
          "
          class="min-h-11 rounded-xl border px-3.5 py-2 text-xs font-semibold tabular-nums transition-colors focus:border-accent focus:ring-2 focus:ring-accent-ring focus:outline-none sm:text-sm"
        >
          @for (year of availableYears(); track year) {
            <option [value]="year">{{ year }}</option>
          }
        </select>
      </div>
    }
  </div>
</header>
