<dialog
  class="reading-log-editor fixed inset-0 z-50 flex items-center justify-center bg-black/55 p-4 backdrop-blur-sm"
  [class.modal-backdrop--closing]="isClosing()"
  open
  tabindex="-1"
  aria-labelledby="modal-title"
  aria-modal="true"
  (cancel)="cancel()"
  (click)="onBackdropClick($event)"
  (keydown.escape)="cancel()"
>
  <div
    class="modal-panel relative flex max-h-[90dvh] w-full max-w-xl flex-col overflow-hidden rounded-2xl border border-subtle bg-surface shadow-2xl"
  >
    <header
      class="flex flex-shrink-0 items-center justify-between gap-3 border-b border-subtle bg-surface-subtle/60 px-5 py-4 sm:px-6"
    >
      <div>
        <span class="text-[10px] font-extrabold tracking-[0.2em] text-ink-muted uppercase">{{
          i18n.t().readingLog.badge
        }}</span>
        <h2 id="modal-title" class="mt-1 font-editorial text-xl leading-tight font-bold text-ink">
          {{ existingLog() ? i18n.t().readingLog.editTitle : i18n.t().readingLog.createTitle }}
        </h2>
      </div>

      <button
        type="button"
        (click)="cancel()"
        class="inline-flex min-h-[44px] min-w-[44px] items-center justify-center rounded-xl text-ink-muted transition-colors hover:bg-surface-subtle hover:text-ink focus-visible:ring-2 focus-visible:ring-accent focus-visible:outline-none"
        [attr.aria-label]="i18n.t().readingLog.closeAria"
        [title]="i18n.t().readingLog.closeAria"
      >
        <svg
          class="h-5 w-5"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>
    </header>

    <form
      class="modal-scroll-area no-scrollbar flex-1 space-y-4 overflow-y-auto p-5 sm:p-6"
      (ngSubmit)="save()"
    >
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <label class="block">
          <span class="field-label">{{ i18n.t().readingLog.date }}</span>
          <input
            type="datetime-local"
            [attr.min]="'1900-01-01T00:00'"
            [attr.max]="maxAllowedDateTime"
            [(ngModel)]="draft.date"
            (ngModelChange)="dateError.set(null)"
            name="date"
            required
            class="field-input"
          />
          @if (dateError()) {
            <span class="mt-1.5 block text-xs font-medium text-rose-600 dark:text-rose-400">{{
              dateError()
            }}</span>
          } @else if (draft.date) {
            <span class="mt-1.5 block text-xs text-ink-muted">{{ formatDate(draft.date) }}</span>
          }
        </label>

        <label class="block">
          <span class="field-label">{{ i18n.t().readingLog.pagesRead }}</span>
          <input
            #pagesReadInput
            type="number"
            min="0"
            [(ngModel)]="draft.pagesRead"
            name="pagesRead"
            required
            class="field-input"
          />
        </label>
      </div>

      @if (appPreferences.trackReadingTime()) {
        <label class="block" data-testid="reading-log-time-field">
          <span class="field-label">{{ i18n.t().readingLog.timeMinutes }}</span>
          <input
            type="number"
            min="0"
            [(ngModel)]="draft.timeSpentMinutes"
            name="timeSpentMinutes"
            class="field-input"
          />
        </label>
      }

      <label class="block">
        <span class="field-label">{{ i18n.t().readingLog.notes }}</span>
        <textarea [(ngModel)]="draft.notes" name="notes" rows="4" class="field-textarea"></textarea>
      </label>

      <div class="flex items-center justify-end gap-3 border-t border-subtle pt-4">
        <button
          class="min-h-[44px] rounded-full border border-strong bg-surface-elevated px-4 py-2 text-xs font-bold text-ink-secondary transition-colors hover:bg-surface-subtle hover:text-ink focus-visible:ring-2 focus-visible:ring-accent focus-visible:outline-none"
          type="button"
          (click)="cancel()"
          [title]="i18n.t().common.cancel"
        >
          {{ i18n.t().common.cancel }}
        </button>
        <button
          class="min-h-[44px] rounded-full bg-accent px-5 py-2 text-xs font-bold text-white shadow-sm transition-colors hover:bg-accent-hover focus-visible:ring-2 focus-visible:ring-accent focus-visible:outline-none disabled:cursor-not-allowed disabled:opacity-50"
          type="submit"
          [disabled]="isSaving()"
          [title]="i18n.t().common.save"
        >
          {{ isSaving() ? i18n.t().common.saving : i18n.t().common.save }}
        </button>
      </div>
    </form>
  </div>
</dialog>
