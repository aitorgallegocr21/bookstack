@if (isMenuOpen()) {
  <div
    class="fixed inset-0 z-30 bg-black/20 backdrop-blur-[1px] md:hidden"
    (click)="closeMenu()"
    aria-hidden="true"
  ></div>
}

<nav
  class="fixed left-1/2 z-40 flex max-w-[calc(100vw-1rem)] -translate-x-1/2 flex-col items-center md:hidden"
  [style.bottom]="position() === 'bottom' ? 'max(0.75rem, env(safe-area-inset-bottom))' : 'auto'"
  [style.top]="position() === 'top' ? 'max(0.75rem, env(safe-area-inset-top))' : 'auto'"
  role="navigation"
  [attr.aria-label]="i18n.t().nav.bottomNavAria"
>
  @if (isMenuOpen()) {
    <div
      role="menu"
      [attr.aria-label]="i18n.t().nav.moreMenuAria"
      [class]="popoverAnimationClass()"
      class="border-border-subtle absolute right-0 z-50 w-60 rounded-2xl border bg-surface-elevated p-2 shadow-xl"
      [class.bottom-full]="position() === 'bottom'"
      [class.mb-2.5]="position() === 'bottom'"
      [class.top-full]="position() === 'top'"
      [class.mt-2.5]="position() === 'top'"
    >
      <div class="space-y-1">
        <a
          routerLink="/series"
          routerLinkActive="bg-accent-soft text-accent-soft-text font-semibold"
          (click)="closeMenu()"
          role="menuitem"
          class="group flex min-h-[44px] items-center gap-3 rounded-xl px-3 py-2 text-sm text-ink-secondary transition-colors hover:bg-accent-soft/65 hover:text-accent-soft-text focus-visible:ring-2 focus-visible:ring-accent-ring focus-visible:outline-none"
        >
          <svg
            [lucideIcon]="Series"
            size="18"
            stroke-width="2"
            class="shrink-0 transition-transform duration-200 group-hover:scale-105"
          ></svg>
          <span>{{ i18n.t().nav.series }}</span>
        </a>

        <button
          type="button"
          role="menuitem"
          (click)="toggleTheme()"
          class="group flex min-h-[44px] w-full items-center gap-3 rounded-xl px-3 py-2 text-sm text-ink-secondary transition-colors hover:bg-accent-soft/65 hover:text-accent-soft-text focus-visible:ring-2 focus-visible:ring-accent-ring focus-visible:outline-none"
        >
          <svg
            [lucideIcon]="themeService.isDark() ? Sun : Moon"
            size="18"
            stroke-width="2"
            class="shrink-0 transition-transform duration-200 group-hover:scale-105"
          ></svg>
          <span>{{
            themeService.isDark() ? i18n.t().nav.lightTheme : i18n.t().nav.darkTheme
          }}</span>
        </button>

        <a
          routerLink="/about"
          routerLinkActive="bg-accent-soft text-accent-soft-text font-semibold"
          (click)="closeMenu()"
          role="menuitem"
          class="group flex min-h-[44px] items-center gap-3 rounded-xl px-3 py-2 text-sm text-ink-secondary transition-colors hover:bg-accent-soft/65 hover:text-accent-soft-text focus-visible:ring-2 focus-visible:ring-accent-ring focus-visible:outline-none"
        >
          <svg
            [lucideIcon]="About"
            size="18"
            stroke-width="2"
            class="shrink-0 transition-transform duration-200 group-hover:scale-105"
          ></svg>
          <span>{{ i18n.t().nav.about }}</span>
        </a>

        <button
          type="button"
          role="menuitem"
          (click)="openGitHub()"
          class="group flex min-h-[44px] w-full items-center gap-3 rounded-xl px-3 py-2 text-sm text-ink-secondary transition-colors hover:bg-accent-soft/65 hover:text-accent-soft-text focus-visible:ring-2 focus-visible:ring-accent-ring focus-visible:outline-none"
        >
          <svg
            [lucideIcon]="Github"
            size="18"
            stroke-width="2"
            class="shrink-0 transition-transform duration-200 group-hover:scale-105"
          ></svg>
          <span>{{ i18n.t().nav.github }}</span>
        </button>

        <div class="bg-border-subtle my-1 h-px"></div>

        <button
          type="button"
          role="menuitem"
          (click)="toggleMobileEdge()"
          class="flex min-h-[44px] w-full items-center gap-3 rounded-xl px-3 py-2 text-sm font-medium text-accent-soft-text transition-colors hover:bg-accent-soft focus-visible:ring-2 focus-visible:ring-accent-ring focus-visible:outline-none"
        >
          <svg
            [lucideIcon]="position() === 'bottom' ? ArrowUp : ArrowDown"
            size="18"
            stroke-width="2"
            class="shrink-0"
          ></svg>
          <span>{{
            position() === 'bottom' ? i18n.t().nav.moveDockTop : i18n.t().nav.moveDockBottom
          }}</span>
        </button>
      </div>
    </div>
  }

  <div
    data-testid="mobile-dock-shell"
    class="border-border-subtle flex items-center rounded-2xl border bg-surface-glass px-1.5 py-1 shadow-lg backdrop-blur-md"
    [class.flex-col]="position() === 'bottom'"
    [class.flex-col-reverse]="position() === 'top'"
  >
    <!-- Centered horizontal drag pill -->
    <button
      type="button"
      data-testid="dock-drag-handle"
      (pointerdown)="onDragStart($event)"
      class="flex h-3 w-12 shrink-0 cursor-grab touch-none items-center justify-center rounded-full text-ink-muted focus-visible:ring-2 focus-visible:ring-accent-ring focus-visible:outline-none active:cursor-grabbing"
      [attr.aria-label]="i18n.t().nav.dockDragHint"
      [title]="i18n.t().nav.dockDragHint"
    >
      <span class="bg-border-strong/70 h-1 w-8 rounded-full"></span>
    </button>

    <div data-testid="mobile-dock-row" class="flex items-center gap-0.5">
      <a
        routerLink="/"
        routerLinkActive="bg-accent-soft text-accent-soft-text font-semibold"
        [routerLinkActiveOptions]="{ exact: true }"
        class="group flex min-h-[44px] min-w-[44px] items-center justify-center rounded-xl text-ink-secondary transition-colors hover:bg-accent-soft/65 hover:text-accent-soft-text focus-visible:ring-2 focus-visible:ring-accent-ring focus-visible:outline-none"
        [attr.aria-label]="i18n.t().nav.home"
        [title]="i18n.t().nav.home"
      >
        <svg
          [lucideIcon]="Home"
          size="20"
          stroke-width="2"
          class="transition-transform duration-200 group-hover:scale-105"
        ></svg>
        <span class="sr-only">{{ i18n.t().nav.home }}</span>
      </a>

      <a
        routerLink="/books"
        routerLinkActive="bg-accent-soft text-accent-soft-text font-semibold"
        class="group flex min-h-[44px] min-w-[44px] items-center justify-center rounded-xl text-ink-secondary transition-colors hover:bg-accent-soft/65 hover:text-accent-soft-text focus-visible:ring-2 focus-visible:ring-accent-ring focus-visible:outline-none"
        [attr.aria-label]="i18n.t().nav.books"
        [title]="i18n.t().nav.books"
      >
        <svg
          [lucideIcon]="Book"
          size="20"
          stroke-width="2"
          class="transition-transform duration-200 group-hover:scale-105"
        ></svg>
        <span class="sr-only">{{ i18n.t().nav.books }}</span>
      </a>

      <!-- Central Add Book CTA -->
      <button
        type="button"
        (click)="openCreate()"
        class="mx-0.5 flex min-h-[44px] min-w-[44px] items-center justify-center rounded-xl bg-accent text-white shadow-sm transition-[transform,background-color,box-shadow] duration-200 hover:-translate-y-0.5 hover:bg-accent-hover hover:shadow-md focus-visible:ring-2 focus-visible:ring-accent-ring focus-visible:outline-none active:translate-y-0 active:scale-[0.98]"
        [attr.aria-label]="i18n.t().nav.createBookAria"
        [title]="i18n.t().nav.createBookAria"
      >
        <svg [lucideIcon]="Plus" size="20" stroke-width="2.4"></svg>
      </button>

      <a
        routerLink="/stats"
        routerLinkActive="bg-accent-soft text-accent-soft-text font-semibold"
        class="group flex min-h-[44px] min-w-[44px] items-center justify-center rounded-xl text-ink-secondary transition-colors hover:bg-accent-soft/65 hover:text-accent-soft-text focus-visible:ring-2 focus-visible:ring-accent-ring focus-visible:outline-none"
        [attr.aria-label]="i18n.t().nav.stats"
        [title]="i18n.t().nav.stats"
      >
        <svg
          [lucideIcon]="Stats"
          size="20"
          stroke-width="2"
          class="transition-transform duration-200 group-hover:scale-105"
        ></svg>
        <span class="sr-only">{{ i18n.t().nav.stats }}</span>
      </a>

      <a
        routerLink="/settings"
        routerLinkActive="bg-accent-soft text-accent-soft-text font-semibold"
        class="group flex min-h-[44px] min-w-[44px] items-center justify-center rounded-xl text-ink-secondary transition-colors hover:bg-accent-soft/65 hover:text-accent-soft-text focus-visible:ring-2 focus-visible:ring-accent-ring focus-visible:outline-none"
        [attr.aria-label]="i18n.t().nav.settings"
        [title]="i18n.t().nav.settings"
      >
        <svg
          [lucideIcon]="Settings"
          size="20"
          stroke-width="2"
          class="transition-transform duration-200 group-hover:scale-105"
        ></svg>
        <span class="sr-only">{{ i18n.t().nav.settings }}</span>
      </a>

      <!-- Brand logo / overflow popover trigger -->
      <button
        type="button"
        (click)="toggleMenu($event)"
        class="flex min-h-[44px] min-w-[44px] items-center justify-center rounded-xl transition-colors hover:bg-accent-soft/65 focus-visible:ring-2 focus-visible:ring-accent-ring focus-visible:outline-none"
        [class.bg-accent-soft]="isMenuOpen()"
        [attr.aria-expanded]="isMenuOpen()"
        [attr.aria-label]="i18n.t().nav.moreMenuAria"
        [title]="i18n.t().nav.moreMenuAria"
      >
        <app-brand-logo [size]="24" />
      </button>
    </div>
  </div>
</nav>
