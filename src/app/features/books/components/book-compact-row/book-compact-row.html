<article
  [style.--book-tint]="bookTint()"
  [attr.data-book-tint-active]="bookTint() ? 'true' : null"
  class="group book-tint-row flex items-center justify-between gap-3 px-3 py-2.5 sm:px-4 sm:py-3"
>
  <!-- Left: Thumbnail + Title & Author -->
  <div class="flex min-w-0 flex-1 items-center gap-3">
    <!-- Cover Thumbnail -->
    <button
      type="button"
      (click)="viewDetails.emit(book().id)"
      class="book-cover-frame aspect-[2/3] w-9 shrink-0 overflow-hidden rounded-md border border-subtle bg-surface-subtle transition-transform duration-200 group-hover:scale-[1.03] focus-visible:ring-2 focus-visible:ring-accent focus-visible:outline-none sm:w-10"
      [attr.aria-label]="i18n.t().books.viewDetails + ': ' + book().title"
      [title]="i18n.t().books.viewDetails + ': ' + book().title"
    >
      @if (book().coverUrl) {
        <img
          [src]="book().coverUrl"
          [alt]="book().title"
          loading="lazy"
          decoding="async"
          class="h-full w-full object-cover"
        />
      } @else {
        <div
          class="flex h-full w-full items-center justify-center font-editorial text-xs font-bold text-ink"
          [style.background]="'linear-gradient(145deg, color-mix(in srgb, var(--book-tint) 24%, var(--surface-subtle)), var(--surface-card))'"
        >
          {{ book().title.slice(0, 1) }}
        </div>
      }
    </button>

    <!-- Title and Author -->
    <div class="min-w-0 flex-1">
      <div class="flex items-center gap-2">
        <h2 class="truncate font-editorial">
          <button
            type="button"
            (click)="viewDetails.emit(book().id)"
            class="truncate text-left text-xs font-semibold text-ink transition-colors hover:text-accent focus-visible:ring-2 focus-visible:ring-accent focus-visible:outline-none sm:text-sm"
            [title]="book().title"
          >
            {{ book().title }}
          </button>
        </h2>

        @if (displayRating(); as rating) {
          <span
            class="xs:inline hidden shrink-0 text-xs font-bold text-amber-600 tabular-nums dark:text-amber-400"
          >
            ★ {{ rating }}
          </span>
        }
      </div>

      <p class="truncate text-[11px] text-ink-secondary sm:text-xs" [title]="book().author">
        {{ book().author }}
        @if (book().series?.name || book().seriesInfo?.seriesName; as sName) {
          <span class="text-ink-muted">· {{ sName }}</span>
        }
      </p>
    </div>
  </div>

  <!-- Center/Right: Status, Format, Progress -->
  <div class="flex items-center gap-3 sm:gap-4">
    <!-- Format Badge -->
    <span class="hidden text-xs text-ink-muted md:inline">
      {{ formatLabel() }}
    </span>

    <!-- Status Badge -->
    <span
      [class]="
        'shrink-0 rounded-full border px-2 py-0.5 text-[9px] font-extrabold uppercase ' +
        getStatusBadgeClass(book().status)
      "
    >
      {{ i18n.t().status[book().status] }}
    </span>

    <!-- Mini Progress Bar & Percentage -->
    <div class="hidden items-center gap-2 sm:flex">
      <div class="h-1.5 w-16 overflow-hidden rounded-full bg-surface-subtle md:w-20">
        <div
          class="h-full rounded-full transition-[width] duration-300"
          [class]="BOOK_STATUS_CONFIG[book().status].dotClass"
          [style.width.%]="progressPercent()"
        ></div>
      </div>
      <span class="w-8 text-right text-xs font-medium text-ink-secondary tabular-nums">
        {{ progressPercent().toFixed(0) }}%
      </span>
    </div>

    <!-- Action Buttons -->
    <div class="flex items-center gap-0.5">
      <button
        type="button"
        (click)="logReading.emit(book().id)"
        class="inline-flex h-8 w-8 items-center justify-center rounded-lg text-accent transition-colors hover:bg-accent-soft focus-visible:ring-2 focus-visible:ring-accent focus-visible:outline-none"
        [attr.aria-label]="i18n.t().books.logReadingAria + ' ' + book().title"
        [title]="i18n.t().books.logAction"
      >
        <svg [lucideIcon]="Plus" size="16" stroke-width="2.5"></svg>
      </button>

      <button
        type="button"
        (click)="viewDetails.emit(book().id)"
        class="inline-flex h-8 w-8 items-center justify-center rounded-lg text-ink-muted transition-colors hover:bg-surface-subtle hover:text-accent focus-visible:ring-2 focus-visible:ring-accent focus-visible:outline-none"
        [attr.aria-label]="i18n.t().books.viewDetails + ': ' + book().title"
        [title]="i18n.t().books.viewDetails"
      >
        <svg [lucideIcon]="Eye" size="16" stroke-width="2"></svg>
      </button>

      <button
        type="button"
        (click)="editBook.emit(book().id)"
        class="inline-flex h-8 w-8 items-center justify-center rounded-lg text-ink-muted transition-colors hover:bg-surface-subtle hover:text-ink focus-visible:ring-2 focus-visible:ring-accent focus-visible:outline-none"
        [attr.aria-label]="i18n.t().books.edit + ' ' + book().title"
        [title]="i18n.t().books.edit"
      >
        <svg [lucideIcon]="Edit2" size="16" stroke-width="2"></svg>
      </button>

      <button
        type="button"
        (click)="deleteBook.emit(book().id)"
        class="inline-flex h-8 w-8 items-center justify-center rounded-lg text-ink-muted transition-colors hover:bg-rose-50 hover:text-rose-600 focus-visible:ring-2 focus-visible:ring-accent focus-visible:outline-none dark:hover:bg-rose-950/30 dark:hover:text-rose-400"
        [attr.aria-label]="i18n.t().books.delete + ' ' + book().title"
        [title]="i18n.t().books.delete"
      >
        <svg [lucideIcon]="Trash2" size="16" stroke-width="2"></svg>
      </button>
    </div>
  </div>
</article>
