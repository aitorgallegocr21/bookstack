name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Se ejecuta automáticamente al hacer push o merge a main

# Permisos requeridos para desplegar en GitHub Pages mediante ID Token
permissions:
  contents: read
  pages: write
  id-token: write

# Permite cancelar despliegues anteriores si haces commits muy seguidos
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar aplicación Angular
        run: npx ng build --configuration production --base-href /bookstack/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefactos de compilación
        uses: actions/upload-pages-artifact@v3
        with:
          # En Angular 18 el build cliente se genera en dist/<nombre-proyecto>/browser
          path: './dist/bookstack/browser'

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
