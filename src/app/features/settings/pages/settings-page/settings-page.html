<div class="mx-auto min-h-screen w-full max-w-3xl space-y-6 px-4 py-6 sm:px-6 lg:px-8">
  <header>
    <h1 class="text-2xl font-bold text-slate-900 dark:text-slate-100">
      {{ i18n.t().settings.title }}
    </h1>
    <p class="mt-1 text-sm text-slate-600 dark:text-slate-400">
      {{ i18n.t().settings.subtitle }}
    </p>
  </header>

  <section
    class="space-y-4 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-800 dark:bg-slate-900"
    aria-labelledby="settings-language-heading"
  >
    <div>
      <h2
        id="settings-language-heading"
        class="text-base font-bold text-slate-900 dark:text-slate-100"
      >
        {{ i18n.t().settings.languageSectionTitle }}
      </h2>
      <p class="mt-1 text-sm text-slate-600 dark:text-slate-400">
        {{ i18n.t().settings.languageSectionDescription }}
      </p>
    </div>

    <div class="max-w-xs">
      <label for="settings-language" class="field-label">
        {{ i18n.t().settings.languageLabel }}
      </label>
      <div class="select-wrap">
        <select
          id="settings-language"
          class="field-select min-h-[44px]"
          [value]="i18n.locale()"
          (change)="onLocaleChange($any($event.target).value)"
        >
          <option value="es">{{ i18n.t().settings.spanishOption }}</option>
          <option value="en">{{ i18n.t().settings.englishOption }}</option>
        </select>
      </div>
    </div>
  </section>

  <section
    class="rounded-2xl border border-dashed border-slate-300 bg-white p-5 dark:border-slate-800 dark:bg-slate-900"
  >
    <p class="text-sm text-slate-600 dark:text-slate-400">
      {{ i18n.t().settings.roadmapNote }}
    </p>
  </section>
</div>
