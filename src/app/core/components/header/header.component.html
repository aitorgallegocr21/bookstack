<header class="md:hidden w-full bg-white dark:bg-slate-900 shadow-sm" role="banner">
  <div class="w-full px-4 py-3 flex items-center justify-between gap-3">
    <a routerLink="/" class="flex items-center gap-2 font-semibold text-lg" aria-label="Ir al inicio">
      <svg [lucideIcon]="Home" size="20" stroke-width="2"></svg>
      <span>Bookstack</span>
    </a>

    <div class="flex items-center gap-2">
      <a
        href="https://github.com/aitorgallegocr21/bookstack.git"
        target="_blank"
        rel="noopener noreferrer"
        class="inline-flex h-10 w-10 items-center justify-center rounded-xl border border-slate-200 bg-white text-slate-700 transition-colors hover:bg-slate-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700"
        aria-label="Repositorio de GitHub"
        title="Repositorio de GitHub"
      >
        <svg [lucideIcon]="Github" size="18" stroke-width="2"></svg>
      </a>

      <button
        type="button"
        class="inline-flex h-10 w-10 items-center justify-center rounded-xl border border-slate-200 bg-white text-slate-700 transition-all duration-300 hover:bg-slate-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700"
        (click)="toggleTheme()"
        [attr.aria-pressed]="themeService.isDark()"
        [attr.aria-label]="themeService.isDark() ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'"
        title="Alternar tema"
      >
        <svg
          [lucideIcon]="themeService.isDark() ? Sun : Moon"
          size="18"
          stroke-width="2"
          class="transition-transform duration-300 motion-safe:group-hover:scale-110"
          [class.rotate-180]="themeService.isDark()"
        ></svg>
      </button>

      <button
        type="button"
        class="inline-flex h-10 w-10 items-center justify-center rounded-xl bg-blue-600 text-white shadow-sm transition-all hover:bg-blue-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2 dark:focus-visible:ring-offset-slate-900"
        (click)="openCreateModal()"
        aria-label="Crear nuevo libro"
        title="Crear nuevo libro"
      >
        <svg [lucideIcon]="Plus" size="18" stroke-width="2.5"></svg>
      </button>
    </div>
  </div>
</header>
