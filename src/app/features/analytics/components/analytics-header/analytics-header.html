<header class="flex flex-col gap-4 lg:flex-row lg:items-end lg:justify-between">
  <div class="min-w-0">
    <h1 class="text-2xl font-bold tracking-tight text-slate-900 sm:text-3xl dark:text-slate-100">
      {{ i18n.t().stats.title }}
    </h1>
    <p class="mt-1 text-sm text-slate-600 dark:text-slate-400">
      {{ i18n.t().stats.subtitle }}
    </p>
  </div>

  <div
    role="group"
    [attr.aria-label]="i18n.t().stats.periods.groupAria"
    class="flex flex-wrap items-center gap-2"
  >
    <button
      type="button"
      data-testid="period-btn-current-year"
      (click)="setPeriodMode('current-year')"
      [attr.aria-pressed]="periodMode() === 'current-year'"
      [class]="
        periodMode() === 'current-year'
          ? 'border-blue-600 bg-blue-600 text-white shadow-xs dark:border-blue-500 dark:bg-blue-500'
          : 'border-slate-200 bg-white text-slate-700 hover:border-slate-300 hover:bg-slate-50 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200 dark:hover:border-slate-600 dark:hover:bg-slate-800'
      "
      class="inline-flex min-h-11 items-center justify-center rounded-full border px-4 py-2 text-xs font-semibold transition-colors focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:outline-none sm:text-sm"
    >
      {{ i18n.t().stats.periods.currentYear }} ({{ currentReferenceYear() }})
    </button>

    <button
      type="button"
      data-testid="period-btn-last-12-months"
      (click)="setPeriodMode('last-12-months')"
      [attr.aria-pressed]="periodMode() === 'last-12-months'"
      [class]="
        periodMode() === 'last-12-months'
          ? 'border-blue-600 bg-blue-600 text-white shadow-xs dark:border-blue-500 dark:bg-blue-500'
          : 'border-slate-200 bg-white text-slate-700 hover:border-slate-300 hover:bg-slate-50 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200 dark:hover:border-slate-600 dark:hover:bg-slate-800'
      "
      class="inline-flex min-h-11 items-center justify-center rounded-full border px-4 py-2 text-xs font-semibold transition-colors focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:outline-none sm:text-sm"
    >
      {{ i18n.t().stats.periods.last12Months }}
    </button>

    <button
      type="button"
      data-testid="period-btn-all-time"
      (click)="setPeriodMode('all-time')"
      [attr.aria-pressed]="periodMode() === 'all-time'"
      [class]="
        periodMode() === 'all-time'
          ? 'border-blue-600 bg-blue-600 text-white shadow-xs dark:border-blue-500 dark:bg-blue-500'
          : 'border-slate-200 bg-white text-slate-700 hover:border-slate-300 hover:bg-slate-50 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200 dark:hover:border-slate-600 dark:hover:bg-slate-800'
      "
      class="inline-flex min-h-11 items-center justify-center rounded-full border px-4 py-2 text-xs font-semibold transition-colors focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:outline-none sm:text-sm"
    >
      {{ i18n.t().stats.periods.allTime }}
    </button>

    @if (availableYears().length > 1) {
      <div class="inline-flex items-center gap-2">
        <label
          for="analytics-year-select"
          class="text-xs font-semibold text-slate-500 dark:text-slate-400"
        >
          {{ i18n.t().stats.periods.specificYearLabel }}
        </label>
        <select
          id="analytics-year-select"
          data-testid="period-year-select"
          [attr.aria-label]="i18n.t().stats.periods.specificYearAria"
          [value]="selectedYear()"
          (change)="onYearSelectChange($event)"
          [class]="
            periodMode() === 'specific-year'
              ? 'border-blue-600 bg-blue-50 text-blue-700 dark:border-blue-500 dark:bg-blue-950/60 dark:text-blue-300'
              : 'border-slate-200 bg-white text-slate-700 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200'
          "
          class="min-h-11 rounded-full border px-3.5 py-2 text-xs font-semibold transition-colors focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 focus:outline-none sm:text-sm"
        >
          @for (year of availableYears(); track year) {
            <option [value]="year">{{ year }}</option>
          }
        </select>
      </div>
    }
  </div>
</header>
