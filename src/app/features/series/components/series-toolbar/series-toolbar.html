<section
  class="@container flex flex-col gap-3 rounded-2xl border border-subtle bg-surface p-3 shadow-xs sm:p-4"
  [attr.aria-label]="i18n.t().series.galleryAria"
>
  <!-- Top Row: Live Search + Sort Dropdown -->
  <div class="flex flex-col gap-2.5 sm:flex-row sm:items-center sm:justify-between">
    <div class="relative min-w-0 flex-1">
      <label for="series-search-input" class="sr-only">
        {{ i18n.t().series.searchAria }}
      </label>
      <div
        class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3.5 text-ink-muted"
        aria-hidden="true"
      >
        <svg [lucideIcon]="Search" size="18" stroke-width="2"></svg>
      </div>

      <input
        id="series-search-input"
        type="text"
        [value]="searchQuery()"
        (input)="onSearchInput($event)"
        [placeholder]="i18n.t().series.searchPlaceholder"
        [attr.aria-label]="i18n.t().series.searchAria"
        class="field-input h-11 py-0 pr-11 pl-10"
      />

      @if (searchQuery().length > 0) {
        <button
          type="button"
          (click)="clearSearch()"
          [attr.aria-label]="i18n.t().series.clearSearchAria"
          [title]="i18n.t().series.clearSearchAria"
          class="absolute inset-y-0 right-0 flex min-h-[44px] min-w-[44px] items-center justify-center text-ink-muted transition-colors hover:text-ink focus-visible:rounded-xl focus-visible:ring-2 focus-visible:ring-accent focus-visible:outline-none"
        >
          <svg [lucideIcon]="X" size="18" stroke-width="2.5"></svg>
        </button>
      }
    </div>

    <div class="relative min-w-0 shrink-0">
      <label for="series-sort-select" class="sr-only">
        {{ i18n.t().series.sortAria }}
      </label>
      <select
        id="series-sort-select"
        [value]="sortOption()"
        (change)="onSortChange($event)"
        [attr.aria-label]="i18n.t().series.sortAria"
        class="field-select h-11 py-0 text-xs font-medium sm:w-auto sm:text-sm"
      >
        @for (opt of sortOptions; track opt) {
          <option [value]="opt">{{ getSortLabel(opt) }}</option>
        }
      </select>
    </div>
  </div>

  <!-- Bottom Row: Mobile/Tablet Status Selector (< 680px) / Symmetric Status Chips (>= 680px) + Non-Shifting Reset Slot -->
  <div class="flex items-center justify-between gap-2 border-t border-subtle pt-2.5">
    <!-- Mobile & Tablet Accessible Status Selector (< 680px) -->
    <div class="relative min-w-0 flex-1 @[680px]:hidden">
      <label for="series-mobile-status-select" class="sr-only">
        {{ i18n.t().series.galleryAria }}
      </label>
      <select
        id="series-mobile-status-select"
        [value]="statusFilter()"
        (change)="onStatusSelectChange($event)"
        [attr.aria-label]="i18n.t().series.galleryAria"
        class="field-select h-11 py-0 text-xs font-medium"
      >
        @for (status of filterStatuses; track status) {
          <option [value]="status">
            {{ getStatusLabel(status) }} ({{ getStatusCount(status) }})
          </option>
        }
      </select>
    </div>

    <!-- Desktop Status Filter Chips (>= 680px, single symmetric non-wrapping row) -->
    <div
      role="tablist"
      [attr.aria-label]="i18n.t().series.galleryAria"
      class="hidden min-w-0 flex-1 items-center gap-1.5 py-0.5 @[680px]:flex"
    >
      @for (status of filterStatuses; track status) {
        <button
          type="button"
          role="tab"
          (click)="onStatusSelect(status)"
          [attr.aria-selected]="statusFilter() === status"
          [class]="
            statusFilter() === status
              ? 'border-accent bg-accent text-white shadow-xs hover:bg-accent-hover'
              : 'border-subtle bg-surface-subtle/60 text-ink-secondary hover:border-strong hover:bg-surface-subtle hover:text-ink'
          "
          class="inline-flex min-h-[38px] shrink-0 items-center gap-1.5 rounded-xl border px-3 py-1.5 text-xs font-medium transition-colors focus-visible:ring-2 focus-visible:ring-accent focus-visible:outline-none sm:text-sm"
        >
          <span>{{ getStatusLabel(status) }}</span>
          <span
            [class]="
              statusFilter() === status
                ? 'bg-white/25 text-white'
                : 'bg-surface-elevated text-ink-secondary'
            "
            class="rounded-full px-2 py-0.5 text-[11px] font-semibold tabular-nums"
          >
            {{ getStatusCount(status) }}
          </span>
        </button>
      }
    </div>

    <!-- Dedicated Non-Shifting Reset Slot -->
    @if (hasActiveFilters()) {
      <div class="flex shrink-0 items-center pl-1">
        <button
          type="button"
          (click)="onResetFilters()"
          [attr.aria-label]="i18n.t().series.empty.resetFilters"
          [title]="i18n.t().series.empty.resetFilters"
          class="inline-flex min-h-[44px] items-center gap-1.5 rounded-xl border border-rose-200/90 bg-rose-50/80 px-2.5 py-1.5 text-xs font-medium text-rose-700 transition-colors hover:border-rose-300 hover:bg-rose-100 focus-visible:ring-2 focus-visible:ring-rose-500 focus-visible:outline-none @[680px]:min-h-[38px] @[680px]:px-3 @[680px]:text-sm dark:border-rose-900/60 dark:bg-rose-950/40 dark:text-rose-300 dark:hover:border-rose-800 dark:hover:bg-rose-900/50"
        >
          <svg [lucideIcon]="RotateCcw" size="14" stroke-width="2.2"></svg>
          <span class="hidden @[840px]:inline">{{ i18n.t().series.empty.resetFilters }}</span>
        </button>
      </div>
    }
  </div>
</section>
